[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peregrinestoop"
version = "0.1.0"
description = "Authorized blackbox recon accelerator — reduces friction between recon steps."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HaiND from the Post and Telecommunication Institute of Technology", email = "haind@ptit.edu.vn" }]
license = { text = "MIT" }
keywords = ["security", "recon", "pentest", "bug-bounty", "authorized"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# `responses` is dev-only: it intercepts the requests HTTP adapter so the
# integration tests exercise the real urllib3 stack (gzip, redirects) without
# touching the network. It is never imported by the package itself.
test = ["pytest>=7.0", "responses>=0.23"]

[project.scripts]
stoop = "peregrinestoop.cli:main"

[project.urls]
Homepage = "https://github.com/Haind03/PeregrineStoop"

[tool.setuptools]
packages = ["peregrinestoop"]

[tool.setuptools.package-data]
peregrinestoop = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
